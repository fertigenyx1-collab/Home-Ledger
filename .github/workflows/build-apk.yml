name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type (debug, release, or both)'
        required: true
        default: 'both'
        type: choice
        options:
          - both
          - release
          - debug

permissions:
  contents: read

jobs:
  build:
    name: Build Android APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        if: github.event.inputs.build_type == 'debug' || github.event.inputs.build_type == 'both' || github.event_name == 'push' || github.event_name == 'pull_request'
        run: ./gradlew assembleDebug --stacktrace

      - name: Build Release APK
        if: github.event.inputs.build_type == 'release' || github.event.inputs.build_type == 'both' || github.event_name == 'push' || github.event_name == 'pull_request'
        run: ./gradlew assembleRelease --stacktrace

      - name: Verify APKs Exist
        run: |
          mkdir -p output-artifacts
          if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            cp app/build/outputs/apk/debug/app-debug.apk output-artifacts/app-debug.apk
            echo "Found debug APK: output-artifacts/app-debug.apk"
          fi
          if [ -f "app/build/outputs/apk/release/app-release.apk" ]; then
            cp app/build/outputs/apk/release/app-release.apk output-artifacts/app-release.apk
            echo "Found release APK: output-artifacts/app-release.apk"
          fi

      - name: Upload Debug APK Artifact
        if: hashFiles('output-artifacts/app-debug.apk') != ''
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: output-artifacts/app-debug.apk
          retention-days: 30

      - name: Upload Release APK Artifact
        if: hashFiles('output-artifacts/app-release.apk') != ''
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: output-artifacts/app-release.apk
          retention-days: 30
